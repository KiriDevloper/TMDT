<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RE-WEAR Admin Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<!-- Màn hình đăng nhập -->
<section id="login" hidden>
  <form id="lf" class="login-card">
    <div class="login-logo"><svg width="56" height="56" viewBox="0 0 48 48" fill="none" stroke="#24502f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M24 11a3.6 3.6 0 1 1 3.6 3.6c-2 .6-3.6 1.8-3.6 3.8V21M24 21 6 33.5c-1 .8-.5 2.3.8 2.3h34.4c1.3 0 1.8-1.5.8-2.3L24 21Z"/><path d="M22 41c0-4.6 3.6-7.6 8.4-7.6 0 4.6-3.6 7.6-8.4 7.6Z" fill="#2f6b3f" stroke="none"/></svg></div>
    <h1>RE-WEAR Admin Panel</h1>
    <p>Đăng nhập bằng tài khoản quản trị</p>
    <input name="email" type="email" placeholder="Email" required autocomplete="username">
    <input name="password" type="password" placeholder="Mật khẩu" required autocomplete="current-password">
    <p id="lerr" class="err"></p>
    <button class="btn lg">Đăng nhập</button>
    <a href="/" class="back">← Về trang bán hàng</a>
  </form>
</section>

<!-- Giao diện quản trị -->
<div class="shell" id="shell" hidden>
  <aside class="side">
    <div class="brand">
      <svg width="64" height="64" viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M24 11a3.6 3.6 0 1 1 3.6 3.6c-2 .6-3.6 1.8-3.6 3.8V21M24 21 6 33.5c-1 .8-.5 2.3.8 2.3h34.4c1.3 0 1.8-1.5.8-2.3L24 21Z"/><path d="M22 41c0-4.6 3.6-7.6 8.4-7.6 0 4.6-3.6 7.6-8.4 7.6Z" fill="#8fc27a" stroke="none"/></svg>
      <b>RE-WEAR</b><span>Admin Panel</span>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot"><em>Thời trang bền vững<br>Vì một hành tinh xanh</em></div>
  </aside>
  <div class="main">
    <header class="top">
      <button class="icon-btn" onclick="toggleSide()" aria-label="Thu gọn menu" id="burger"></button>
      <div class="gsearch">
        <label class="gs"><span id="gsi"></span><input id="gq" placeholder="Tìm kiếm nhanh... (sản phẩm, đơn hàng, người dùng)" autocomplete="off"></label>
        <div id="gres" class="gres" hidden></div>
      </div>
      <div class="top-r">
        <a class="icon-btn bell" href="#/dashboard" aria-label="Việc cần xử lý"><span id="bell"></span><i id="bn" class="bn"></i></a>
        <div class="who"><span class="av" id="av"></span><b id="wn"></b></div>
        <a class="lk" href="/" title="Xem trang bán hàng">Xem sàn</a>
      </div>
    </header>
    <main id="view"></main>
  </div>
</div>

<dialog id="dlg"><form id="dlg-f"><h3 id="dlg-t"></h3><div id="dlg-b"></div><div class="dlg-a" id="dlg-a"></div></form></dialog>
<div id="toast" role="status"></div>
<script src="admin.js"></script>
</body>
</html>
