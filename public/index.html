<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RE-WEAR - Thời trang secondhand bền vững</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{--bg:#fbf6ee;--g:#24502f;--g2:#2f6b3f;--soft:#e3ecd9;--ink:#1d2b21;--mut:#6b7468;--line:#e6dccb;--red:#c0392b}
body{background:var(--bg);color:var(--ink);font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.text-brand{color:var(--g)}
.h1{font-size:1.6rem;font-weight:800;color:var(--g);margin-bottom:.8rem}
/* nút */
.btn{display:inline-flex;align-items:center;gap:.4rem;background:var(--g);color:#fff;border-radius:999px;padding:.55rem 1.2rem;font-size:.9rem;font-weight:600;cursor:pointer;border:1.5px solid var(--g)}
.btn:hover{background:#1b3d24}.btn:disabled{opacity:.55;cursor:default}
.btn.alt{background:transparent;color:var(--g)}.btn.alt:hover{background:var(--soft)}
.btn.danger{background:var(--red);border-color:var(--red)}
.btn.lg{padding:.85rem 1.7rem;font-size:1rem}
input,select,textarea{border:1px solid var(--line);border-radius:10px;padding:.55rem .75rem;width:100%;background:#fff;font-size:.9rem}
.box{background:#fff;border:1px solid var(--line);border-radius:14px}
.tag{background:var(--soft);color:var(--g);border-radius:999px;padding:.12rem .6rem;font-size:.75rem;font-weight:600;white-space:nowrap}
/* header */
header{background:var(--bg);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.hd{display:flex;align-items:center;gap:22px;height:76px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.6rem;color:var(--g);letter-spacing:.02em}
.menu{display:flex;gap:26px;font-size:.95rem;font-weight:500}
.menu>a,.dd>button{padding:.3rem 0;border-bottom:2px solid transparent}
.menu a.on{border-color:var(--g)}
.dd{position:relative}.dd>button{display:flex;gap:4px;align-items:center}
.dd-m{display:none;position:absolute;top:100%;left:0;min-width:190px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 8px 24px rgba(36,80,47,.12)}
.dd:hover .dd-m,.dd:focus-within .dd-m{display:block}
.dd-m a,.dd-m button{display:block;width:100%;text-align:left;padding:.5rem .75rem;border-radius:8px;font-size:.9rem}
.dd-m a:hover,.dd-m button:hover{background:var(--soft)}
.dd.r .dd-m{left:auto;right:0}
.search{flex:1;max-width:420px;margin-left:auto;display:flex;align-items:center;gap:8px;background:#f3ecdf;border:1px solid var(--line);border-radius:999px;padding:0 16px}
.search input{border:0;background:transparent;padding:.7rem 0}
.icons{display:flex;gap:18px;align-items:center}
.icons a,.icons button{position:relative;display:flex;color:var(--ink)}
.badge-n{position:absolute;top:-8px;right:-10px;background:var(--red);color:#fff;font-size:.65rem;font-weight:700;border-radius:999px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px}
/* hero */
.hero{position:relative;overflow:hidden;background:linear-gradient(90deg,#f6efe2,#f1e8d8);min-height:360px}
.hero-in{position:relative;z-index:2;padding-top:56px;padding-bottom:56px;max-width:1180px;margin:0 auto;padding-left:20px;padding-right:20px}
.hero h1{font-size:clamp(2rem,4.6vw,3.5rem);font-weight:800;line-height:1.1;color:var(--g);letter-spacing:-.01em}
.hero p{font-size:1.1rem;margin:18px 0 26px;max-width:480px;line-height:1.5}
.hero-img{position:absolute;right:0;top:0;height:100%;width:56%;object-fit:cover;object-position:left center;-webkit-mask-image:linear-gradient(90deg,transparent,#000 28%);mask-image:linear-gradient(90deg,transparent,#000 28%)}
@media(max-width:820px){.hero{min-height:0}.hero-img{position:relative;width:100%;height:240px;-webkit-mask-image:none;mask-image:none}.hero-in{padding-top:32px;padding-bottom:28px}.menu{display:none}.search{max-width:none}.hd{gap:12px}.logo span{display:none}}
/* danh mục + sản phẩm */
.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin:16px 0 30px}
.cat{display:block;border-radius:12px;overflow:hidden;aspect-ratio:2.3/1}.cat img{width:100%;height:100%;object-fit:cover;transition:transform .25s}.cat:hover img{transform:scale(1.04)}
@media(max-width:820px){.cats{grid-template-columns:repeat(2,1fr)}.cat:last-child{grid-column:span 2}}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.sec-h h2{font-size:1.4rem;font-weight:800;color:var(--g)}.more{font-size:.9rem;font-weight:500}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media(max-width:900px){.grid4{grid-template-columns:repeat(2,1fr)}}
.pc{position:relative;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pimg{display:block;position:relative;aspect-ratio:4/3;background:#eadfcd}.pimg img{width:100%;height:100%;object-fit:cover}
.pbadge{position:absolute;top:10px;left:10px;background:var(--g2);color:#fff;font-size:.75rem;font-weight:600;border-radius:999px;padding:.2rem .7rem}
.heart{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;color:var(--ink)}
.heart.on{color:var(--red)}.heart.on svg{fill:var(--red)}
.pinfo{display:block;padding:10px 12px 12px}.pt{font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pm{font-size:.78rem;color:var(--mut);margin:2px 0 4px}.price{font-size:1.15rem;font-weight:800;color:var(--g)}
/* dải xanh cuối trang */
.band{background:var(--g);color:#fff;margin-top:40px}
.band-in{display:flex;align-items:center;gap:30px;padding-top:26px;padding-bottom:26px;flex-wrap:wrap}
.band-t{font-size:1.5rem;font-style:italic;font-weight:700;flex:1;min-width:260px}
.band ul{display:flex;gap:28px;flex-wrap:wrap}.band li{display:flex;align-items:center;gap:10px;font-size:.85rem;max-width:150px;line-height:1.3}
.foot{text-align:center;font-size:.8rem;color:var(--mut);padding:14px}
.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
@media(max-width:820px){.filters{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header>
  <div class="wrap hd">
    <a href="#/" class="logo" aria-label="RE-WEAR">
      <svg width="46" height="46" viewBox="0 0 48 48" fill="none" stroke="#24502f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M24 11a3.6 3.6 0 1 1 3.6 3.6c-2 .6-3.6 1.8-3.6 3.8V21M24 21 6 33.5c-1 .8-.5 2.3.8 2.3h34.4c1.3 0 1.8-1.5.8-2.3L24 21Z"/><path d="M22 41c0-4.6 3.6-7.6 8.4-7.6 0 4.6-3.6 7.6-8.4 7.6Z" fill="#2f6b3f" stroke="none"/></svg>
      <span>RE-WEAR</span>
    </a>
    <nav class="menu" aria-label="Menu chính">
      <a href="#/" id="m-home">Trang chủ</a>
      <div class="dd"><button type="button">Mua sắm <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m2 4 4 4 4-4"/></svg></button>
        <div class="dd-m"><a href="#/browse">Tất cả sản phẩm</a><a href="#/browse?sort=price_asc">Giá thấp đến cao</a><a href="#/browse?condition=NEW">Mới 99%</a></div></div>
      <div class="dd"><button type="button">Danh mục <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m2 4 4 4 4-4"/></svg></button>
        <div class="dd-m"><a href="#/browse?category=thun">Áo thun</a><a href="#/browse?category=somi">Áo sơ mi</a><a href="#/browse?category=jeans">Quần jeans</a><a href="#/browse?category=khoac">Áo khoác</a><a href="#/browse?category=phukien">Phụ kiện</a></div></div>
      <a href="#/how">Cách hoạt động</a>
    </nav>
    <form id="hs" class="search" role="search">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input name="q" placeholder="Tìm áo, quần, phong cách..." aria-label="Tìm kiếm">
    </form>
    <div class="icons">
      <a href="#/favorites" aria-label="Yêu thích"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 21s-7-4.6-9.3-9A5.3 5.3 0 0 1 12 6.6 5.3 5.3 0 0 1 21.3 12C19 16.4 12 21 12 21Z"/></svg></a>
      <div id="acct" class="dd r"></div>
      <a href="#/cart" aria-label="Giỏ hàng"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2.5l2.2 10.5a1 1 0 0 0 1 .8h8.6a1 1 0 0 0 1-.7L20 8H6.3"/><circle cx="9.5" cy="19.5" r="1.3"/><circle cx="17" cy="19.5" r="1.3"/></svg><span id="cartN" class="badge-n"></span></a>
    </div>
  </div>
</header>
<main id="app"></main>
<script>
const $ = s => document.querySelector(s);
const vnd = n => Number(n).toLocaleString('vi-VN') + 'đ';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ST = {PENDING_PAYMENT:'Chờ thanh toán',PAID:'Đã thanh toán, sàn đang giữ tiền',SHIPPED:'Đang giao',RECEIVED:'Đã nhận, chờ hết hạn khiếu nại',DISPUTED:'Đang khiếu nại',COMPLETED:'Hoàn tất',REFUNDED:'Đã hoàn tiền',CANCELLED:'Đã hủy'};
const COND = {NEW:'Mới 99%',GOOD:'Rất tốt',FAIR:'Khá tốt',FLAW:'Có lỗi nhỏ'};
const CAT = {thun:'Áo thun',somi:'Áo sơ mi',jeans:'Quần jeans',khoac:'Áo khoác',phukien:'Phụ kiện',khac:'Khác'};
const TXN = {HOLD:'Sàn giữ tiền',RELEASE:'Nhận tiền bán hàng',REFUND:'Hoàn tiền',WITHDRAW:'Rút tiền'};
const HEART = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 21s-7-4.6-9.3-9A5.3 5.3 0 0 1 12 6.6 5.3 5.3 0 0 1 21.3 12C19 16.4 12 21 12 21Z"/></svg>';
let token = localStorage.t, me = null;
const ls = k => JSON.parse(localStorage[k] || '[]');
const cart = () => ls('cart'), favs = () => ls('favs');
const setCart = a => { localStorage.cart = JSON.stringify(a); header(); };
const page = h => `<div class="wrap" style="padding-top:24px;padding-bottom:30px">${h}</div>`;

async function api(p, o = {}) {
  const fd = o.body instanceof FormData;
  const r = await fetch('/api' + p, { ...o, headers: { ...(fd ? {} : {'Content-Type':'application/json'}), ...(token ? {Authorization:'Bearer ' + token} : {}) }, body: o.body && !fd ? JSON.stringify(o.body) : o.body });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'Có lỗi xảy ra');
  return d;
}
const act = async (f, then) => { try { await f(); if (then) then(); } catch (e) { alert(e.message); } };
const needLogin = () => { if (!me) { location.hash = '#/login'; return true; } };
const logout = () => { delete localStorage.t; token = me = null; location.hash = '#/'; route(); };

function header() {
  const n = cart().length; $('#cartN').textContent = n; $('#cartN').style.display = n ? 'grid' : 'none';
  $('#acct').innerHTML = me
    ? `<button type="button" aria-label="Tài khoản"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="10" r="3.2"/><path d="M6 19c1.5-3 4-4 6-4s4.5 1 6 4"/></svg></button><div class="dd-m"><div class="px-3 py-2 text-sm"><b>${esc(me.name)}</b><div class="text-xs" style="color:var(--mut)">Ví: ${vnd(me.wallet)}</div></div><a href="#/sell">Đăng bán sản phẩm</a><a href="#/orders">Đơn hàng</a><a href="#/wallet">Ví của tôi</a>${me.role === 'admin' ? '<a href="#/admin">Quản trị</a>' : ''}<button onclick="logout()">Đăng xuất</button></div>`
    : `<a href="#/login" aria-label="Đăng nhập"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="10" r="3.2"/><path d="M6 19c1.5-3 4-4 6-4s4.5 1 6 4"/></svg></a>`;
  $('#m-home').className = (location.hash || '#/') === '#/' ? 'on' : '';
}
$('#hs').onsubmit = e => { e.preventDefault(); const q = e.target.q.value.trim(); location.hash = '#/browse' + (q ? '?q=' + encodeURIComponent(q) : ''); };

function toggleFav(id, btn) {
  const f = favs(), on = f.includes(id);
  localStorage.favs = JSON.stringify(on ? f.filter(x => x !== id) : [...f, id]);
  btn.classList.toggle('on', !on);
  if (location.hash === '#/favorites') favorites();
}
const card = p => `<div class="pc"><a href="#/p/${p.id}" class="pimg">${p.images?.[0] ? `<img src="${esc(p.images[0].url)}" alt="${esc(p.title)}" loading="lazy">` : ''}<span class="pbadge">${COND[p.condition]}</span></a>
<button class="heart ${favs().includes(p.id) ? 'on' : ''}" onclick="toggleFav(${p.id},this)" aria-label="Yêu thích">${HEART}</button>
<a href="#/p/${p.id}" class="pinfo"><div class="pt">${esc(p.title)}</div><div class="pm">${esc(p.brand)}, size ${esc(p.size)}</div><div class="price">${vnd(p.price)}</div></a></div>`;

/* ---------- Trang chủ ---------- */
async function home() {
  const ps = (await api('/products')).slice(0, 4);
  const ic = d => `<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
  $('#app').innerHTML = `<section class="hero"><div class="hero-in"><h1>Mặc lại phong cách.<br>Tạo nên giá trị mới.</h1><p>Khám phá những món đồ secondhand độc đáo, chất lượng với mức giá dễ yêu.</p>
    <div class="flex flex-wrap gap-3"><a class="btn lg" href="#/browse">Khám phá ngay <span aria-hidden="true">→</span></a><a class="btn alt lg" href="#/sell">Đăng bán sản phẩm</a></div></div>
    <img class="hero-img" src="/img/hero.jpg" alt="Phong cách thời trang secondhand"></section>
  <div class="wrap"><div class="cats">${Object.keys(CAT).filter(k => k !== 'khac').map(k => `<a class="cat" href="#/browse?category=${k}" aria-label="${CAT[k]}"><img src="/img/cat-${k}.jpg" alt="${CAT[k]}"></a>`).join('')}</div>
    <div class="sec-h"><h2>🔥 Món đồ đang được yêu thích</h2><a class="more" href="#/browse">Xem tất cả →</a></div>
    <div class="grid4">${ps.map(card).join('') || '<p style="color:var(--mut)">Chưa có sản phẩm. Hãy là người đăng bán đầu tiên.</p>'}</div></div>
  <section class="band"><div class="wrap band-in"><p class="band-t">Thời trang bền vững bắt đầu từ lựa chọn của bạn</p><ul>
    <li>${ic('<path d="M7 8l3-4 3 4M10 4v9a3 3 0 0 0 3 3h2"/><path d="M17 16l-3 4-3-4M20 12l-3-3-3 3"/>')}Tái sử dụng quần áo</li>
    <li>${ic('<path d="M5 19c0-8 5-13 14-14 0 9-5 14-14 14Z"/><path d="M5 19 13 11"/>')}Giảm rác thải thời trang</li>
    <li>${ic('<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>')}Vì một hành tinh xanh hơn</li></ul></div></section>
  <div class="foot">RE-WEAR, đồ án học phần Thương mại điện tử</div>`;
}

/* ---------- Duyệt sản phẩm ---------- */
async function browse(_, qs) {
  const p = new URLSearchParams(qs || '');
  $('#app').innerHTML = page(`<h1 class="h1">${p.get('category') ? CAT[p.get('category')] || 'Sản phẩm' : 'Tất cả sản phẩm'}</h1>
  <form id="f" class="filters"><input name="q" placeholder="Từ khóa"><select name="category"><option value="">Mọi danh mục</option>${Object.entries(CAT).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select>
  <input name="brand" placeholder="Thương hiệu"><input name="size" placeholder="Size">
  <select name="condition"><option value="">Mọi tình trạng</option>${Object.entries(COND).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select>
  <select name="sort"><option value="">Mới nhất</option><option value="price_asc">Giá tăng dần</option><option value="price_desc">Giá giảm dần</option></select>
  <input name="min" type="number" placeholder="Giá từ"><input name="max" type="number" placeholder="Giá đến"><button class="btn" style="grid-column:1/-1;justify-content:center">Lọc sản phẩm</button></form><div id="g" class="grid4"></div>`);
  const f = $('#f'); [...p].forEach(([k, v]) => { if (f[k]) f[k].value = v; });
  f.onsubmit = e => {
    e.preventDefault(); const np = new URLSearchParams(new FormData(f)); [...np].forEach(([k, v]) => { if (!v) np.delete(k); });
    const h = '#/browse' + (np.toString() ? '?' + np : ''); if (location.hash === h) browse(null, np.toString()); else location.hash = h;
  };
  const ps = await api('/products?' + p);
  $('#g').innerHTML = ps.map(card).join('') || '<p class="col-span-full" style="color:var(--mut)">Chưa có sản phẩm phù hợp. Thử bỏ bớt bộ lọc.</p>';
}

async function favorites() {
  const ps = (await Promise.all(favs().map(id => api('/products/' + id).catch(() => null)))).filter(p => p && p.status === 'APPROVED');
  $('#app').innerHTML = page(`<h1 class="h1">Sản phẩm yêu thích</h1><div class="grid4">${ps.map(card).join('') || '<p style="color:var(--mut)">Bạn chưa lưu sản phẩm nào. Bấm biểu tượng trái tim trên sản phẩm để lưu.</p>'}</div>`);
}

async function how() {
  const col = (t, a) => `<div class="box p-5"><h2 class="font-bold text-lg mb-2 text-brand">${t}</h2><ol class="list-decimal pl-5 space-y-1 text-sm">${a.map(x => `<li>${x}</li>`).join('')}</ol></div>`;
  $('#app').innerHTML = page(`<h1 class="h1">Cách hoạt động</h1><div class="grid md:grid-cols-3 gap-4">
  ${col('Khi mua', ['Tìm món đồ bạn thích, xem ảnh thật và số đo thực tế', 'Thêm vào giỏ hàng, đặt hàng', 'Thanh toán, sàn giữ tiền an toàn', 'Nhận hàng và kiểm tra', 'Hàng đúng mô tả thì đánh giá người bán, sai mô tả thì khiếu nại trong 48 giờ'])}
  ${col('Khi bán', ['Đăng ký tài khoản, đăng sản phẩm với tối thiểu 4 ảnh thật', 'Sàn duyệt tin trước khi hiển thị', 'Có đơn thì đóng gói sạch và gửi hàng', 'Người mua nhận hàng, hết hạn khiếu nại thì tiền về ví', 'Phí hoa hồng 10%, rút tiền khi cần'])}
  ${col('Cam kết của sàn', ['Giữ tiền đến khi người mua nhận hàng', 'Không đăng bán hàng giả, hàng nhái', 'Hoàn tiền nếu hàng sai mô tả', 'Sàn làm trọng tài khi có tranh chấp', 'Đánh giá công khai của người mua thật'])}</div>`);
}

/* ---------- Sản phẩm, giỏ hàng ---------- */
async function product(id) {
  const p = await api('/products/' + id), inCart = cart().includes(p.id);
  $('#app').innerHTML = page(`<div class="grid md:grid-cols-2 gap-8"><div class="grid grid-cols-2 gap-2">${p.images.map(i => `<img src="${esc(i.url)}" alt="" class="w-full aspect-square object-cover" style="border-radius:12px">`).join('') || '<div class="col-span-2 aspect-square" style="background:#eadfcd;border-radius:12px"></div>'}</div>
  <div><span class="tag">${COND[p.condition]}</span><h1 class="text-2xl font-extrabold mt-2 text-brand">${esc(p.title)}</h1><div class="text-2xl font-extrabold my-2 text-brand">${vnd(p.price)}</div>
  <dl class="text-sm grid grid-cols-3 gap-y-2 mb-4"><dt style="color:var(--mut)">Danh mục</dt><dd class="col-span-2">${CAT[p.category] || 'Khác'}</dd><dt style="color:var(--mut)">Thương hiệu</dt><dd class="col-span-2">${esc(p.brand)}</dd><dt style="color:var(--mut)">Size</dt><dd class="col-span-2">${esc(p.size)}</dd><dt style="color:var(--mut)">Số đo thực tế</dt><dd class="col-span-2">${esc(p.measures)}</dd><dt style="color:var(--mut)">Chất liệu</dt><dd class="col-span-2">${esc(p.material) || 'Không rõ'}</dd></dl>
  <p class="text-sm mb-3">${esc(p.description)}</p>
  <p class="text-sm mb-5">Người bán: <a class="underline" href="#/shop/${p.seller.id}">${esc(p.seller.name)}</a>${p.reviews ? `, ${p.rating.toFixed(1)}/5 sao (${p.reviews} đánh giá)` : ', chưa có đánh giá'}</p>
  ${p.status === 'APPROVED' ? `<button class="btn lg" onclick="addCart(${p.id})" ${inCart ? 'disabled' : ''}>${inCart ? 'Đã trong giỏ hàng' : 'Thêm vào giỏ hàng'}</button>` : '<p style="color:var(--mut)">Sản phẩm này hiện không còn để bán.</p>'}
  <p class="text-xs mt-4" style="color:var(--mut)">Sàn giữ tiền đến khi bạn nhận hàng. Bạn có thể khiếu nại trong 48 giờ nếu hàng sai mô tả.</p></div></div>`);
}
const addCart = id => { setCart([...new Set([...cart(), id])]); product(id); };

async function cartView() {
  const ps = (await Promise.all(cart().map(id => api('/products/' + id).catch(() => null)))).filter(p => p && p.status === 'APPROVED');
  setCart(ps.map(p => p.id));
  if (!ps.length) return $('#app').innerHTML = page('<h1 class="h1">Giỏ hàng trống</h1><a class="btn" href="#/browse">Xem sản phẩm</a>');
  const total = ps.reduce((a, p) => a + p.price, 0);
  $('#app').innerHTML = page(`<h1 class="h1">Giỏ hàng</h1><div class="space-y-2 mb-4">${ps.map(p => `<div class="box p-2 flex gap-3 items-center"><div class="w-20 h-16 overflow-hidden" style="background:#eadfcd;border-radius:8px">${p.images[0] ? `<img src="${esc(p.images[0].url)}" alt="" class="w-full h-full object-cover">` : ''}</div><div class="flex-1 text-sm"><div class="font-semibold">${esc(p.title)}</div><div>${vnd(p.price)}</div></div><button class="btn alt" onclick="setCart(cart().filter(x=>x!==${p.id}));cartView()">Xóa</button></div>`).join('')}</div>
  <p class="mb-1 font-bold">Tổng: ${vnd(total)} <span class="font-normal text-sm" style="color:var(--mut)">(chưa gồm phí vận chuyển)</span></p><p class="text-xs mb-3" style="color:var(--mut)">Sản phẩm của nhiều người bán sẽ được tách thành nhiều đơn.</p>
  <textarea id="addr" rows="2" placeholder="Địa chỉ nhận hàng" class="mb-3"></textarea><button class="btn lg" onclick="checkout()">Đặt hàng</button>`);
}
const checkout = () => act(async () => {
  if (needLogin()) return;
  await api('/orders', { method: 'POST', body: { productIds: cart(), address: $('#addr').value } });
  setCart([]); location.hash = '#/orders';
});

/* ---------- Tài khoản ---------- */
async function loginView() {
  let reg = false;
  const draw = () => {
    $('#app').innerHTML = page(`<form id="lf" class="box max-w-sm mx-auto p-6 space-y-3"><h1 class="text-xl font-extrabold text-brand">${reg ? 'Tạo tài khoản' : 'Đăng nhập'}</h1>
    ${reg ? '<input name="name" placeholder="Họ tên" required>' : ''}<input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Mật khẩu (tối thiểu 6 ký tự)" required>
    <button class="btn w-full justify-center">${reg ? 'Tạo tài khoản' : 'Đăng nhập'}</button><button type="button" id="sw" class="text-sm underline">${reg ? 'Đã có tài khoản? Đăng nhập' : 'Chưa có tài khoản? Đăng ký'}</button>
    <p class="text-xs" style="color:var(--mut)">Tài khoản thử: buyer@rewear.vn / 123456, shop@rewear.vn / 123456, admin@rewear.vn / admin123</p></form>`);
    $('#sw').onclick = () => { reg = !reg; draw(); };
    $('#lf').onsubmit = e => { e.preventDefault(); act(async () => {
      const d = await api(reg ? '/register' : '/login', { method: 'POST', body: Object.fromEntries(new FormData(e.target)) });
      token = localStorage.t = d.token; me = d.user; location.hash = '#/'; route();
    }); };
  };
  draw();
}

async function sellView() {
  if (needLogin()) return;
  const mine = await api('/my/products'), SN = {PENDING:'Chờ duyệt',APPROVED:'Đang bán',REJECTED:'Bị từ chối',RESERVED:'Đang có đơn',SOLD:'Đã bán'};
  $('#app').innerHTML = page(`<h1 class="h1">Đăng bán sản phẩm</h1><p class="text-sm mb-3" style="color:var(--mut)">Cần tối thiểu 4 ảnh thật: mặt trước, mặt sau, nhãn mác và chi tiết lỗi (nếu có). Tin đăng hiển thị sau khi sàn duyệt.</p>
  <form id="sf" class="box grid md:grid-cols-2 gap-3 p-5 mb-8"><input name="title" placeholder="Tên sản phẩm" required><input name="brand" placeholder="Thương hiệu" required>
  <select name="category">${Object.entries(CAT).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select><select name="condition">${Object.entries(COND).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select>
  <input name="size" placeholder="Size" required><input name="measures" placeholder="Số đo thực tế (ngực, vai, dài...)" required><input name="material" placeholder="Chất liệu"><input name="price" type="number" min="1000" placeholder="Giá (VNĐ)" required>
  <input name="images" type="file" accept="image/jpeg,image/png,image/webp" multiple required class="md:col-span-2"><textarea name="description" rows="2" class="md:col-span-2" placeholder="Mô tả, nêu rõ lỗi nếu có"></textarea><button class="btn md:col-span-2 justify-center">Gửi duyệt</button></form>
  <h2 class="font-extrabold text-lg mb-3 text-brand">Sản phẩm của tôi</h2><div class="grid4">${mine.map(p => `<div class="relative">${card(p)}<span class="tag absolute" style="top:48px;left:10px">${SN[p.status]}</span></div>`).join('') || '<p style="color:var(--mut)">Bạn chưa đăng sản phẩm nào.</p>'}</div>`);
  $('#sf').onsubmit = e => { e.preventDefault(); act(() => api('/products', { method: 'POST', body: new FormData(e.target) }), () => { alert('Đã gửi, chờ sàn duyệt.'); sellView(); }); };
}

async function ordersView(tab = 'buy') {
  if (needLogin()) return;
  const os = await api('/orders?role=' + tab), run = (path, body) => act(() => api(path, { method: 'POST', body }), () => ordersView(tab));
  window.run = run;
  const acts = o => {
    const b = (label, path, cls = '') => `<button class="btn ${cls}" onclick="run('/orders/${o.id}/${path}',{})">${label}</button>`;
    if (tab === 'buy') {
      if (o.status === 'PENDING_PAYMENT') return b('Thanh toán (mô phỏng)', 'pay') + b('Hủy đơn', 'cancel', 'alt');
      if (o.status === 'SHIPPED') return b('Đã nhận hàng', 'receive');
      if (o.status === 'RECEIVED') return `<button class="btn danger" onclick="dispute(${o.id})">Khiếu nại hàng sai mô tả</button>`;
      if (o.status === 'COMPLETED' && !o.review) return `<button class="btn" onclick="review(${o.id})">Đánh giá người bán</button>`;
    } else if (o.status === 'PAID') return b('Đã gửi hàng', 'ship');
    return '';
  };
  $('#app').innerHTML = page(`<div class="flex gap-2 mb-4"><button class="btn ${tab === 'buy' ? '' : 'alt'}" onclick="ordersView('buy')">Tôi mua</button><button class="btn ${tab === 'sell' ? '' : 'alt'}" onclick="ordersView('sell')">Tôi bán</button></div>
  <div class="space-y-3">${os.map(o => `<div class="box p-4 text-sm"><div class="flex justify-between mb-1"><b>Đơn #${o.id}</b><span class="tag">${ST[o.status]}</span></div>
  <div class="mb-1">${o.items.map(i => esc(i.product.title)).join(', ')}</div><div>Tổng: ${vnd(o.total)}${tab === 'sell' ? `, phí sàn ${vnd(o.commission)}, bạn nhận ${vnd(o.total - o.commission)}` : ''}</div>
  <div class="mb-2" style="color:var(--mut)">${tab === 'buy' ? 'Người bán: ' + esc(o.seller.name) : 'Người mua: ' + esc(o.buyer.name) + ', giao tới: ' + esc(o.address)}</div>${o.dispute ? `<div class="mb-2" style="color:var(--red)">Khiếu nại: ${esc(o.dispute.reason)}</div>` : ''}<div class="flex gap-2 flex-wrap">${acts(o)}</div></div>`).join('') || '<p style="color:var(--mut)">Chưa có đơn hàng nào.</p>'}</div>`);
}
const dispute = id => { const r = prompt('Lý do khiếu nại (kèm mô tả lỗi):'); if (r) run(`/orders/${id}/dispute`, { reason: r }); };
const review = id => { const r = prompt('Số sao (1-5):', '5'); if (!r) return; const c = prompt('Nhận xét:') || ''; run(`/orders/${id}/review`, { rating: r, comment: c }); };

async function walletView() {
  if (needLogin()) return;
  const w = await api('/wallet');
  $('#app').innerHTML = page(`<h1 class="h1">Ví của tôi</h1><p class="text-3xl font-extrabold mb-4 text-brand">${vnd(w.wallet)}</p>
  <form id="wf" class="flex gap-2 max-w-sm mb-6"><input name="amount" type="number" placeholder="Số tiền muốn rút" required><button class="btn">Rút tiền</button></form>
  <h2 class="font-extrabold text-lg mb-2 text-brand">Lịch sử giao dịch</h2><div class="box text-sm">${w.txns.map(t => `<div class="p-3 flex justify-between" style="border-bottom:1px solid var(--line)"><span>${TXN[t.type]}${t.orderId ? ' (đơn #' + t.orderId + ')' : ''}</span><b>${vnd(t.amount)}</b></div>`).join('') || '<p class="p-3" style="color:var(--mut)">Chưa có giao dịch.</p>'}</div>`);
  $('#wf').onsubmit = e => { e.preventDefault(); act(() => api('/wallet/withdraw', { method: 'POST', body: Object.fromEntries(new FormData(e.target)) }), async () => { me = await api('/me'); header(); walletView(); }); };
}

async function shopView(id) {
  const d = await api('/shops/' + id);
  $('#app').innerHTML = page(`<h1 class="h1">${esc(d.user.name)}</h1><div class="grid4 mb-8">${d.products.map(card).join('') || '<p style="color:var(--mut)">Shop chưa có sản phẩm đang bán.</p>'}</div>
  <h2 class="font-extrabold text-lg mb-2 text-brand">Đánh giá từ người mua</h2><div class="space-y-2 text-sm">${d.reviews.map(r => `<div class="box p-3"><b>${esc(r.author.name)}</b>, ${r.rating}/5 sao<div>${esc(r.comment)}</div></div>`).join('') || '<p style="color:var(--mut)">Chưa có đánh giá.</p>'}</div>`);
}

async function adminView() {
  if (!me || me.role !== 'admin') return $('#app').innerHTML = page('<p>Chỉ quản trị viên được truy cập.</p>');
  const [ps, ds] = await Promise.all([api('/admin/products'), api('/admin/disputes')]), re = () => adminView();
  window.mod = (id, a) => act(() => api(`/admin/products/${id}/${a}`, { method: 'POST' }), re);
  window.res = (id, d) => act(() => api(`/admin/disputes/${id}/resolve`, { method: 'POST', body: { decision: d } }), re);
  $('#app').innerHTML = page(`<h1 class="h1">Tin chờ duyệt (${ps.length})</h1><div class="space-y-2 mb-8">${ps.map(p => `<div class="box p-3 flex gap-3 items-center flex-wrap"><div class="flex gap-1">${p.images.slice(0, 4).map(i => `<img src="${esc(i.url)}" alt="" class="w-14 h-14 object-cover" style="border-radius:8px">`).join('')}</div><div class="flex-1 text-sm"><b>${esc(p.title)}</b>, ${esc(p.brand)}, ${vnd(p.price)}<div style="color:var(--mut)">Người bán: ${esc(p.seller.name)}</div></div><button class="btn" onclick="mod(${p.id},'approve')">Duyệt</button><button class="btn danger" onclick="mod(${p.id},'reject')">Từ chối</button></div>`).join('') || '<p style="color:var(--mut)">Không có tin nào chờ duyệt.</p>'}</div>
  <h1 class="h1">Khiếu nại đang mở (${ds.length})</h1><div class="space-y-2">${ds.map(d => `<div class="box p-3 text-sm"><b>Đơn #${d.orderId}</b>, ${vnd(d.order.total)}: ${d.order.items.map(i => esc(i.product.title)).join(', ')}<div>Người mua ${esc(d.order.buyer.name)} khiếu nại: ${esc(d.reason)}</div><div class="mt-2 flex gap-2 flex-wrap"><button class="btn danger" onclick="res(${d.id},'REFUND')">Hoàn tiền cho người mua</button><button class="btn" onclick="res(${d.id},'RELEASE')">Giải ngân cho người bán</button></div></div>`).join('') || '<p style="color:var(--mut)">Không có khiếu nại.</p>'}</div>`);
}

const R = { '': home, browse, favorites, how, p: product, cart: cartView, login: loginView, sell: sellView, orders: () => ordersView('buy'), wallet: walletView, admin: adminView, shop: shopView };
async function route() {
  if (token && !me) me = await api('/me').catch(() => { delete localStorage.t; token = null; });
  header();
  const [path, qs] = location.hash.slice(2).split('?'), [a, b] = path.split('/');
  window.scrollTo(0, 0);
  try { await (R[a] || home)(b, qs); } catch (e) { $('#app').innerHTML = page(`<p style="color:var(--red)">${esc(e.message)}</p>`); }
}
addEventListener('hashchange', route);
route();
</script>
</body>
</html>
